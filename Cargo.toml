[workspace]
resolver = "2"
members = ["backend", "cli"]
default-members = ["cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
